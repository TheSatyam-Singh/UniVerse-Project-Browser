name: UniVerse
options:
  bundleIdPrefix: com.universe.projectbrowser
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: U5L5T3NGVV
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  UniVerseKit:
    path: Packages/UniVerseKit
targets:
  UniVerse:
    type: application
    platform: iOS
    sources:
      - path: App
        type: syncedFolder
    dependencies:
      - package: UniVerseKit
        product: UniVerseShared
      - package: UniVerseKit
        product: UniVerseSync
      - package: UniVerseKit
        product: UniVerseBrowser
      - package: UniVerseKit
        product: UniVerseDesign
      - target: UniVerseWidgets
      - target: UniVerseShare
      - target: UniVerseOpen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.universe.projectbrowser.ios
        PRODUCT_NAME: UniVerse
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/UniVerse-Info.plist
        CODE_SIGN_ENTITLEMENTS: $(UNIVERSE_ENTITLEMENTS_$(UNIVERSE_DEFAULT_BROWSER))
        UNIVERSE_DEFAULT_BROWSER: NO
        UNIVERSE_ENTITLEMENTS_NO: Config/UniVerse.entitlements
        UNIVERSE_ENTITLEMENTS_YES: Config/UniVerse-DefaultBrowser.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: UniVerse Project Browser
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "UniVerse Project Browser uses the camera to scan the sync code your Mac shows, and for websites that ask to use it."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "UniVerse Project Browser uses the microphone when you search with your voice, and for websites that ask to use it."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "UniVerse Project Browser turns what you say into a search when you use Voice Search."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Websites you visit may ask for your location."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "UniVerse Project Browser saves images you choose to your photo library."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
  UniVerseWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        type: syncedFolder
    dependencies:
      - package: UniVerseKit
        product: UniVerseBrowser
      - package: UniVerseKit
        product: UniVerseDesign
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.universe.projectbrowser.ios.widgets
        PRODUCT_NAME: UniVerseWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Widgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Widgets.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: UniVerse Project Browser
        SKIP_INSTALL: YES
  UniVerseShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Share
        type: syncedFolder
    dependencies:
      - package: UniVerseKit
        product: UniVerseBrowser
      - package: UniVerseKit
        product: UniVerseDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.universe.projectbrowser.ios.share
        PRODUCT_NAME: UniVerseShare
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Share-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Share.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: UniVerse Project Browser
        SKIP_INSTALL: YES
  UniVerseOpen:
    type: app-extension
    platform: iOS
    sources:
      - path: Action
        type: syncedFolder
    dependencies:
      - package: UniVerseKit
        product: UniVerseDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.universe.projectbrowser.ios.open
        PRODUCT_NAME: UniVerseOpen
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Open-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Open.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Open in UniVerse Project Browser
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
schemes:
  UniVerse:
    build:
      targets:
        UniVerse: all
    run:
      config: Debug
    archive:
      config: Release
