name: Windows

on:
  pull_request:
    paths:
      - "apps/windows/**"
      - "apps/android/blocking/**"
      - ".github/workflows/universe-windows.yml"
  push:
    branches: [master]
    paths:
      - "apps/windows/**"
      - "apps/android/blocking/**"
      - ".github/workflows/universe-windows.yml"

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate the Windows tree
        run: python apps/windows/scripts/check-windows-tree.py

      - name: Restore NuGet packages
        working-directory: apps/windows
        run: dotnet restore UniVerseProjectBrowser.sln

      - name: Build the shell
        working-directory: apps/windows
        run: dotnet build UniVerseProjectBrowser.sln -c Release -p:Platform=x64 --no-restore

      - name: Publish the portable app
        working-directory: apps/windows
        run: dotnet publish src/UniVerseProjectBrowser/UniVerseProjectBrowser.csproj -c Release -r win-x64 --self-contained -p:WindowsPackageType=None -o publish/app --no-build

      - name: Publish the MSIX
        working-directory: apps/windows
        run: dotnet publish src/UniVerseProjectBrowser/UniVerseProjectBrowser.csproj -c Release -r win-x64 --self-contained -p:WindowsPackageType=MSIX -p:AppxPackageSigningEnabled=false -o publish/msix --no-build

      - name: Check the MSIX was produced
        working-directory: apps/windows
        shell: pwsh
        run: |
          $msix = Get-ChildItem -Path publish/msix -Filter *.msix -Recurse | Select-Object -First 1
          if (-not $msix) { Write-Error "No .msix found under publish/msix"; exit 1 }
          Write-Host "MSIX: $($msix.FullName) ($($msix.Length) bytes)"

      - name: Zip the portable app
        working-directory: apps/windows
        shell: pwsh
        run: Compress-Archive -Path publish/app/* -DestinationPath publish/UniVerse-Project-Browser-windows-x64.zip

      - name: Import the code-signing certificate
        if: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
        working-directory: apps/windows
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64)
          [IO.File]::WriteAllBytes("windows-cert.pfx", $bytes)

      - name: Sign the MSIX
        if: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
        working-directory: apps/windows
        shell: pwsh
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $msix = Get-ChildItem -Path publish/msix -Filter *.msix -Recurse | Select-Object -First 1
          signtool sign /fd SHA256 /f windows-cert.pfx /p $env:WINDOWS_CERT_PASSWORD $msix.FullName
          Remove-Item windows-cert.pfx -Force

      - name: Upload the MSIX
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: universe-project-browser-windows-msix
          path: apps/windows/publish/msix/*.msix
          if-no-files-found: warn

      - name: Upload the portable zip
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: universe-project-browser-windows-zip
          path: apps/windows/publish/UniVerse-Project-Browser-windows-x64.zip
          if-no-files-found: warn
