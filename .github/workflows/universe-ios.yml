# UniVerse-Project-Browser — iOS simulator build (Ardia's ios.yml, minus the vouch gate).
#
# Optional: iOS is out of scope for v1 (macOS + Windows + Android), so this
# workflow only proves the iPhone app still builds for the simulator and its
# Swift packages still pass their tests. It is not a release path; the iOS
# release workflow (ios-release.yml, App Store Connect) was deleted with it.
# No secrets are used: the simulator build runs with CODE_SIGNING_ALLOWED=NO.
# No vouch gate — this repo has no vouch system.
# Note the iOS app was not rebranded in Phase 1: the project is still
# apps/ios/UniVerse.xcodeproj, scheme UniVerse, and the UniVerseKit packages.
name: iOS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  app:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      SCRATCH: ${{ github.workspace }}/.ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Build the app for the simulator
        run: >-
          xcodebuild -project apps/ios/UniVerse.xcodeproj -scheme UniVerse -configuration Debug
          -destination 'generic/platform=iOS Simulator' -derivedDataPath "$SCRATCH/dd"
          CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO -quiet build

  packages:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      SCRATCH: ${{ github.workspace }}/.ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Toolchain
        run: |
          swift --version
          node --version
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .ci/universekit
            .ci/sync
          key: swiftpm-xcode-27.1-${{ github.sha }}
          restore-keys: swiftpm-xcode-27.1-
      - name: The JavaScriptCore bundles match their TypeScript
        run: node apps/ios/scripts/bundle-shared.mjs --check
      - name: UniVerseKit tests
        run: swift test --package-path apps/ios/Packages/UniVerseKit --scratch-path "$SCRATCH/universekit"
      - name: Sync core tests
        run: swift test --package-path packages/sync --scratch-path "$SCRATCH/sync"
      - if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .ci/universekit
            .ci/sync
          key: swiftpm-xcode-27.1-${{ github.sha }}
