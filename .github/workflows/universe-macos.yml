name: macOS

on:
  push:
    branches: [master]
    tags: ["v*"]

  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.2.42 or 0.2.42-nightly.1"
        type: string
        required: false
        default: ""

      dry_run:
        description: "Dry run: build without publishing"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:

  # --------------------------------------------------
  # PREFLIGHT
  # --------------------------------------------------

  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      version: ${{ steps.plan.outputs.version }}
      rc: ${{ steps.plan.outputs.rc }}
      tree: ${{ steps.plan.outputs.tree }}
      signing: ${{ steps.plan.outputs.signing }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_INPUT: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}

          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}

        run: |
          set -euo pipefail

          fail() {
            echo "::error::$*"
            exit 1
          }

          version="$VERSION_INPUT"
          rc=true

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            rc=false
            [ -z "$version" ] && version="${GITHUB_REF#refs/tags/v}"
          elif [ "$DRY_RUN" = "false" ]; then
            rc=false
          fi

          if [ -z "$version" ]; then
            version=$(sed -n 's/.*MARKETING_VERSION = "\{0,1\}\([^";]*\)"\{0,1\};/\1/p' \
              apps/browser/macos/UniVerse-Project-Browser.xcodeproj/project.pbxproj | sort -u)
          fi

          [ -n "$version" ] || fail "No version found."

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-nightly\.[0-9]+)?$ ]]; then
            fail "Invalid version format: $version"
          fi

          check() {
            if [ "$rc" = true ]; then
              echo "::warning::$* (a real release would stop here)"
            else
              fail "$*"
            fi
          }

          . scripts/lib/releases.sh

          channel=$(channel_of "$version") || fail "Invalid release channel."

          project=$(sed -n 's/.*MARKETING_VERSION = "\{0,1\}\([^";]*\)"\{0,1\};/\1/p' \
            apps/browser/macos/UniVerse-Project-Browser.xcodeproj/project.pbxproj | sort -u)

          [ "$project" = "$version" ] || check "MARKETING_VERSION is $project"

          [ -f "docs/release-notes/$version.md" ] || check "Release notes missing."

          if [ "$rc" = false ] && gh release view "v$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            check "Release v$version already exists."
          fi

          tree=$(engine/engine-key.sh)

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

          if [[ -n "$MACOS_CERTIFICATE_P12" &&
                -n "$MACOS_CERTIFICATE_PASSWORD" &&
                -n "$MACOS_PROVISIONING_PROFILE" &&
                -n "$SPARKLE_ED_PRIVATE_KEY" ]]; then
            echo "signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "signing=false" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "### UniVerse Project Browser $version ($channel)"
            echo "- Commit: $GITHUB_SHA"
            echo "- Engine: ${tree:0:12}"

            if [ "$rc" = true ]; then
              echo "- Dry run: nothing published"
            else
              echo "- Production release"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------
  # CHECKS
  # --------------------------------------------------

  checks:
    needs: preflight
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

      - if: ${{ !cancelled() }}
        run: pnpm test

      - if: ${{ !cancelled() }}
        run: pnpm shaders:check

  # --------------------------------------------------
  # BUILD
  # --------------------------------------------------

  build:
    needs: preflight
    runs-on: xcode-27
    timeout-minutes: 120

    env:
      CAS_PATH: ${{ github.workspace }}/.xcode-cas
      DERIVED_DATA: ${{ github.workspace }}/apps/browser/build-release-ci
      TREE: ${{ needs.preflight.outputs.tree }}
      VERSION: ${{ needs.preflight.outputs.version }}
      RC: ${{ needs.preflight.outputs.rc }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: paths
        run: |
          if [ "$RC" = true ]; then
            dist="dist/$VERSION-rc"
          else
            dist="dist/$VERSION"
          fi
          echo "dist=$dist" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: apps/browser/build-universecore/prebuilt
          key: engine-${{ env.TREE }}

      - name: Engine
        run: |
          framework=$(packages/universecore/scripts/fetch-engine.sh) || {
            echo "::error::Engine not found."
            exit 1
          }

          {
            echo "ARDIACORE_FRAMEWORK=$framework"
            echo "ARDIACORE_FRAMEWORK_ENGINE=$TREE"
          } >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/0.12.15/install.sh | sh

      - name: Install Pods
        working-directory: apps/browser/macos
        run: pod install

      - name: Build macOS application
        run: |
          args=("$VERSION" --phase build)

          if [ "$RC" = true ]; then
            args+=(--rc)
          fi

          export RELEASE_BUILD_DIR="$DERIVED_DATA"
          export RELEASE_BUILD_SETTINGS="COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH=$CAS_PATH"

          scripts/release.sh "${args[@]}"

      - name: Package build
        env:
          DIST: ${{ steps.paths.outputs.dist }}
        run: |
          COPYFILE_DISABLE=1 tar --no-mac-metadata -cf "$RUNNER_TEMP/build.tar" \
            -C "$DIST" \
            UniVerse-Project-Browser.xcarchive \
            provenance.txt \
            "universe-cli-$VERSION-macos-arm64.tar.gz" \
            "universe-cli-$VERSION-macos-arm64.tar.gz.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: build
          path: ${{ runner.temp }}/build.tar
          if-no-files-found: error
          retention-days: 3

  # --------------------------------------------------
  # SIGN AND NOTARIZE
  # --------------------------------------------------

  sign:
    needs: [preflight, build]

    if: ${{ needs.preflight.outputs.signing == 'true' }}

    runs-on: xcode-27
    timeout-minutes: 150

    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      RC: ${{ needs.preflight.outputs.rc }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: build
          path: ${{ runner.temp }}/build-download

      - name: Unpack build
        run: |
          /usr/bin/python3 -I .github/release/unpack-build.py \
            "$RUNNER_TEMP/build-download/build.tar" \
            "$RUNNER_TEMP/build-in" \
            "$VERSION"

      - name: Download Sparkle tools
        run: |
          tarball="$RUNNER_TEMP/Sparkle-2.9.6.tar.xz"

          curl -fsSL --retry 3 -o "$tarball" \
            https://github.com/sparkle-project/Sparkle/releases/download/2.9.6/Sparkle-2.9.6.tar.xz

          expected="52bf9e88cdd972fc0c81501377a880e90d47031bd8ca5462488f843e2609e192"
          actual=$(shasum -a 256 "$tarball" | awk '{ print $1 }')

          [ "$actual" = "$expected" ] || {
            echo "::error::Sparkle checksum mismatch"
            exit 1
          }

          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$tarball" -C "$RUNNER_TEMP/sparkle" bin

          echo "SPARKLE_BIN=$RUNNER_TEMP/sparkle/bin" >> "$GITHUB_ENV"

      - name: Configure signing
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          ALLOW_MISSING_NOTARY: ${{ needs.preflight.outputs.rc == 'true' && '1' || '0' }}
        run: .github/release/signing.sh setup

      - name: Sign and package
        run: |
          export RELEASE_BUILD_INPUT="$RUNNER_TEMP/build-in"

          args=("$VERSION" --phase sign)

          if [ "$RC" = true ]; then
            args+=(--rc)
          fi

          scripts/release.sh "${args[@]}"

      - name: Remove signing credentials
        if: always()
        run: |
          secrets="$RUNNER_TEMP/release-signing"

          if [ -f "$secrets/release.keychain-db" ]; then
            security delete-keychain "$secrets/release.keychain-db" || true
          fi

          rm -rf "$secrets"

      - name: Launch check
        run: |
          args=("$VERSION" --phase check)

          if [ "$RC" = true ]; then
            args+=(--rc)
          fi

          scripts/release.sh "${args[@]}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release
          path: |
            dist/${{ needs.preflight.outputs.version }}/UniVerse-Project-Browser-${{ needs.preflight.outputs.version }}.dmg
            dist/${{ needs.preflight.outputs.version }}/UniVerse-Project-Browser-${{ needs.preflight.outputs.version }}.zip
            dist/${{ needs.preflight.outputs.version }}/appcast.xml
            dist/${{ needs.preflight.outputs.version }}/release-notes.md
            dist/${{ needs.preflight.outputs.version }}/provenance.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  # --------------------------------------------------
  # UNSIGNED PACKAGE
  # --------------------------------------------------

  package-unsigned:
    needs: [preflight, build, sign]

    if: >-
      ${{
        always() &&
        needs.build.result == 'success' &&
        needs.sign.result == 'skipped'
      }}

    runs-on: xcode-27
    timeout-minutes: 30

    env:
      VERSION: ${{ needs.preflight.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: build
          path: ${{ runner.temp }}/build-download

      - name: Unpack build
        run: |
          /usr/bin/python3 -I .github/release/unpack-build.py \
            "$RUNNER_TEMP/build-download/build.tar" \
            "$RUNNER_TEMP/build-in" \
            "$VERSION"

      - name: Create unsigned DMG and ZIP
        run: |
          set -euo pipefail

          dist="dist/$VERSION-unsigned"
          in="$RUNNER_TEMP/build-in"

          app="$in/UniVerse-Project-Browser.xcarchive/Products/Applications/UniVerse-Project-Browser.app"

          [ -d "$app" ] || {
            echo "::error::Application not found"
            exit 1
          }

          mkdir -p "$dist"

          cp "$in/provenance.txt" "$dist/"

          cp "$in/universe-cli-$VERSION-macos-arm64.tar.gz" \
             "$in/universe-cli-$VERSION-macos-arm64.tar.gz.sha256" \
             "$dist/"

          ditto -c -k --keepParent "$app" \
            "$dist/UniVerse-Project-Browser-$VERSION.zip"

          staging="$dist/dmg-staging"

          mkdir -p "$staging"

          ditto "$app" "$staging/UniVerse-Project-Browser.app"

          ln -s /Applications "$staging/Applications"

          hdiutil create \
            -volname "UniVerse Project Browser" \
            -srcfolder "$staging" \
            -format UDZO \
            -ov "$dist/UniVerse-Project-Browser-$VERSION.dmg"

          rm -rf "$staging"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-unsigned
          path: |
            dist/${{ needs.preflight.outputs.version }}-unsigned/UniVerse-Project-Browser-${{ needs.preflight.outputs.version }}.dmg
            dist/${{ needs.preflight.outputs.version }}-unsigned/UniVerse-Project-Browser-${{ needs.preflight.outputs.version }}.zip
            dist/${{ needs.preflight.outputs.version }}-unsigned/provenance.txt
          if-no-files-found: error
          retention-days: 14

  # --------------------------------------------------
  # PUBLISH
  # --------------------------------------------------

  publish:
    needs: [preflight, checks, sign]

    if: ${{ needs.preflight.outputs.rc == 'false' && needs.sign.result == 'success' }}

    runs-on: macos-15
    timeout-minutes: 30

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.preflight.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release
          path: dist/${{ needs.preflight.outputs.version }}

      - name: Create tag
        run: |
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag already exists"
          else
            git tag "v$VERSION" "$GITHUB_SHA"
            git push origin "refs/tags/v$VERSION"
          fi

      - name: Publish release
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

        run: |
          export RELEASE_DIST="$GITHUB_WORKSPACE/dist/$VERSION"

          if [ -n "$TAP_TOKEN" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          else
            export PUBLISH_TAP=0
          fi

          .claude/skills/release/scripts/publish.sh "$VERSION"
